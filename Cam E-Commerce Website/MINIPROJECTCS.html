<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gallery{
            display:flex;
            flex-wrap: wrap;
            gap:10px;
            padding:20px;
        }

        .gallery img{
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
            transition: transform(0.3s);
        }

        .gallery img:hover{
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <h1>Gallery</h1>
    <div class="gallery">
        <img src="Cam1.jpg" alt="Image 1">
        <img src="Cam2.jpg" alt="Image 2">
    </div>
</body>
</html>
